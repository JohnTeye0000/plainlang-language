name: CI

# Run the full test suite on every push and pull request.
on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (interpreter, VM, diagnostics, analyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tree-walking interpreter
        run: python test_plainlang.py
      - name: Bytecode VM cross-validation
        run: python test_vm.py
      - name: Diagnostics
        run: python test_diagnostics.py
      - name: Static analyzer
        run: python test_check.py
      - name: Differential fuzzing (both engines must agree)
        run: python test_fuzz.py
      - name: Differential fuzzing (Python vs the JavaScript engine)
        run: python test_fuzz_js.py
      - name: Differential fuzzing (the JS transpiler vs the JS engine)
        run: python test_fuzz_transpiler.py
      - name: Code formatter
        run: python test_fmt.py
      - name: Multi-file imports
        run: python test_imports.py
      - name: Language server
        run: python test_lsp.py
      - name: WebAssembly backend (runs real .wasm under Node)
        run: python test_wasm.py
      - name: Documentation (every example runs, engines agree, every keyword covered)
        run: python test_docs.py
      - name: Accessibility (WCAG AA palette contrast, landmarks, labels, keyboard support)
        run: python test_a11y.py
      - name: Language specification (grammar vs both parsers; every rule's example on every engine)
        run: python test_spec.py
      - name: SPEC.md is up to date
        run: python build_spec.py --check
      - name: Unified command-line tool
        run: python test_cli.py
      - name: Every suite is wired into CI and the runner
        run: python test_meta.py

  javascript:
    name: JavaScript engine (interpreter, transpiler, diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS engine + transpiler tests
        run: node test_js.js
      - name: Workbook lessons (every solution passes its own check)
        run: node test_lessons.js
