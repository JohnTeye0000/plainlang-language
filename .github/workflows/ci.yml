name: CI

# Run the full test suite on every push and pull request.
on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (interpreter, VM, diagnostics, analyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tree-walking interpreter
        run: python test_plainlang.py
      - name: Bytecode VM cross-validation
        run: python test_vm.py
      - name: Diagnostics
        run: python test_diagnostics.py
      - name: Static analyzer
        run: python test_check.py
      - name: Differential fuzzing (both engines must agree)
        run: python test_fuzz.py
      - name: Code formatter
        run: python test_fmt.py
      - name: Multi-file imports
        run: python test_imports.py
      - name: Language server
        run: python test_lsp.py

  javascript:
    name: JavaScript engine (interpreter, transpiler, diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS engine + transpiler tests
        run: node test_js.js
